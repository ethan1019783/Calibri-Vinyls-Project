<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="/output.css">
</head>
<body>

 <nav class="flex items-center justify-between px-6 md:px-16 lg:px-24 xl:px-32 py-4 border-b border-gray-300 bg-white relative transition-all">
    
    <div class="hidden sm:flex items-center gap-8">

        <a href="/" class="cursor-pointer px-8 py-2 bg-indigo-500 hover:bg-indigo-600 transition text-white rounded-full">Back</a>
    </div>
</nav>

    <div class="flex items-center justify-center w-screen ">
        <form class="translate-y-16 bg-white text-gray-500 max-w-[350px] mx-4 md:p-6 p-4 text-left text-sm rounded-xl shadow-[0px_0px_10px_0px] shadow-black/10">
            <h2 class="text-2xl font-semibold mb-6 text-center text-gray-800">Login Now</h2>
            <input id="email" class="w-full border my-3 border-gray-500/30 outline-none rounded-full py-2.5 px-4" type="email" placeholder="Enter your email" required>
            <input id="password" class="w-full border mt-1 border-gray-500/30 outline-none rounded-full py-2.5 px-4" type="password" placeholder="Enter your password" required>
            <div class="text-right py-4">
                <a class="text-blue-600 underline" href="#">Forgot Password</a>
            </div>
            <button type="submit" class="w-full mb-3 bg-indigo-500 hover:bg-indigo-600/90 active:scale-95 transition py-2.5 rounded-full text-white">Log in</button>
            <p class="text-center mt-4">Don’t have an account? <a href="#" class="text-blue-500 underline">Signup Now</a></p>
        </form>
    </div>






</body>
</html>
